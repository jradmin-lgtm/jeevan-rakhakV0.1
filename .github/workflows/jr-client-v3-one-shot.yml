name: JR observed 520 client recovery one shot
on:
  push:
    branches: [codex/jr-load-client-v3-20261016]
permissions:
  contents: read
concurrency:
  group: jr-client-v3-one-shot-20261016
  cancel-in-progress: false
jobs:
  isolated-client-test:
    if: github.repository == 'jradmin-lgtm/jeevan-rakhakV0.1' && github.run_attempt == 1 && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed wrapper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout exact reviewed measurement source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 563cbd9eeb859b914f1874b6d2086de11b115f3e
          path: .harness
          persist-credentials: false
      - name: Build pinned Node 24 measurement image
        run: docker build -f .harness/scripts/hosted-load/Dockerfile -t jr-reviewed-load:one-shot .harness
      - name: Run unchanged 10 ride app cadence with aggregate evidence only
        env:
          JR_HOSTED_LOAD_DATABASE_URL: ${{ secrets.JR_OCT16_V3_LOAD_DATABASE_URL }}
          JR_HOSTED_LOAD_JWT_SECRET: ${{ secrets.JR_OCT16_V3_LOAD_JWT_SECRET }}
          JR_HOSTED_LOAD_CONFIRM: jr-load-oct16-v3-hosted
        run: node scripts/hosted-load/ci/launch-v3.cjs
      - name: Stop owned container if runner cancels
        if: always()
        run: node scripts/hosted-load/ci/launch-v3.cjs --cleanup
